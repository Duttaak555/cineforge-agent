[project]
name = "cineforge-agent"
version = "0.1.0"
description = "Schema-first, self-healing multi-agent AI video studio with MCP, C2PA provenance, and NLE export."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "mcp[cli]>=1.2.0",
    "opentimelineio>=0.17.0",
    "c2pa-python>=0.38.0",
    "playwright>=1.49.0",
    "httpx>=0.27.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
cineforge-mcp = "cineforge.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
