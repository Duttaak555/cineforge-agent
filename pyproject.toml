[project]
name = "cineforge-agent"
version = "0.1.7"
description = "Schema-first, self-healing multi-agent AI video studio with MCP 2.x, C2PA provenance, and NLE export."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "mcp[cli]>=2.0.0",
    "opentimelineio>=0.17.0",
    "c2pa-python>=0.38.0",
    "playwright>=1.49.0",
    "httpx>=0.27.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0", "mypy>=1.13.0"]

[project.scripts]
cineforge-mcp = "cineforge.mcp.server:main"
cineforge-doctor = "cineforge.cli:doctor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cineforge"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
